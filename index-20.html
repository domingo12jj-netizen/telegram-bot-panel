<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram Bot Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0f172a;color:#e5e7eb}
header{padding:18px 20px;background:#111827;border-bottom:1px solid #243044}h1{margin:0;font-size:22px}
main{max-width:900px;margin:auto;padding:18px}.card{background:#111827;border:1px solid #263449;border-radius:16px;padding:18px;margin-bottom:16px}
label{display:block;margin:12px 0 6px;color:#9ca3af}input,textarea,button{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:white}
button{background:#2563eb;border:0;font-weight:700;margin-top:12px;cursor:pointer}.danger{background:#dc2626}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.status{padding:10px;border-radius:10px;background:#172033;margin-top:10px}.ok{color:#4ade80}.muted{color:#94a3b8}
pre{white-space:pre-wrap;background:#080d16;padding:12px;border-radius:10px;overflow:auto}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>🤖 Telegram Bot Panel</h1></header>
<main>
<div class="card">
<h2>Conexión</h2>
<label>Token del bot</label>
<input id="token" type="password" placeholder="Pega aquí el token de @BotFather">
<button onclick="connect()">Conectar bot</button>
<div id="status" class="status muted">Desconectado</div>
</div>

<div class="card">
<h2>Enviar mensaje</h2>
<label>Chat ID</label><input id="chatId" placeholder="Ej. 123456789">
<label>Mensaje</label><textarea id="message" rows="5" placeholder="Escribe tu mensaje..."></textarea>
<button onclick="sendMessage()">Enviar</button>
<div id="sendStatus" class="status muted"></div>
</div>

<div class="card">
<h2>Información del bot</h2>
<pre id="botInfo">Conecta el bot para ver la información.</pre>
</div>

<div class="card">
<h2>Prueba</h2>
<p class="muted">Escribe /start al bot desde Telegram y luego usa el Chat ID que aparezca en el servidor.</p>
</div>
</main>
<script>
async function connect(){
 const token=document.getElementById('token').value.trim();
 if(!token)return alert('Pon el token del bot.');
 setStatus('Conectando...','');
 try{
   const r=await fetch('/api/bot-info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
   const d=await r.json();
   if(!r.ok)throw new Error(d.error||'No se pudo conectar');
   setStatus('🟢 Bot conectado','ok');
   document.getElementById('botInfo').textContent=JSON.stringify(d.bot,null,2);
   sessionStorage.setItem('botToken',token);
 }catch(e){setStatus('🔴 '+e.message,'');}
}
async function sendMessage(){
 const token=sessionStorage.getItem('botToken')||document.getElementById('token').value.trim();
 const chatId=document.getElementById('chatId').value.trim();
 const text=document.getElementById('message').value;
 if(!token||!chatId||!text)return alert('Completa token, Chat ID y mensaje.');
 try{
   const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,chatId,text})});
   const d=await r.json();
   document.getElementById('sendStatus').textContent=r.ok?'✅ Mensaje enviado':'❌ '+(d.error||'Error');
 }catch(e){document.getElementById('sendStatus').textContent='❌ '+e.message}
}
function setStatus(t,c){const e=document.getElementById('status');e.textContent=t;e.className='status '+c}
</script>
</body></html>
